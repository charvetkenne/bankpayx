version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: bankpayx-postgres
    environment:
      POSTGRES_DB: mobilemoney_db
      POSTGRES_USER: mobilemoney_user
      POSTGRES_PASSWORD: mobilemoney_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobilemoney_user -d mobilemoney_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bankpayx-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: bankpayx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bankpayx-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: bankpayx-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:10.4.0
    container_name: bankpayx-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: bankpayx123
    volumes:
      - grafana_data:/var/lib/grafana

  mobilemoney-service:
    build: .
    container_name: bankpayx-mobilemoney-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mobilemoney_db
      DB_USERNAME: mobilemoney_user
      DB_PASSWORD: mobilemoney_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8180/realms/bankpayx}
      MTN_API_KEY: ${MTN_API_KEY:-mtn-api-key}
      MTN_API_SECRET: ${MTN_API_SECRET:-mtn-api-secret}
      MTN_SUBSCRIPTION_KEY: ${MTN_SUBSCRIPTION_KEY:-mtn-sub-key}
      ORANGE_CLIENT_ID: ${ORANGE_CLIENT_ID:-orange-client-id}
      ORANGE_CLIENT_SECRET: ${ORANGE_CLIENT_SECRET:-orange-secret}
      ORANGE_MERCHANT_ID: ${ORANGE_MERCHANT_ID:-orange-merchant}
      WAVE_API_KEY: ${WAVE_API_KEY:-wave-api-key}
      WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET:-wave-secret}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-cinetpay-key}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-cinetpay-site}
      CINETPAY_SECRET_KEY: ${CINETPAY_SECRET_KEY:-cinetpay-secret}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  grafana_data: